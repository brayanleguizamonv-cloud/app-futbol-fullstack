spring.application.name=backend
# ===============================
# CONEXIÓN A POSTGRESQL (DOCKER)
# ===============================
# Apuntamos al localhost de tu PC, que redirige al puerto 5432 del contenedor
spring.datasource.url=jdbc:postgresql://localhost:5432/app_futbol_db
spring.datasource.username=admin_futbol
spring.datasource.password=admin_pass

# ===============================
# CONFIGURACIÓN JPA / HIBERNATE
# ===============================
# Le decimos a Spring que NO intente crear o modificar las tablas, porque ya lo hicimos nosotros en la Fase 2
spring.jpa.hibernate.ddl-auto=none

# Imprime en la consola el SQL que Spring genera por debajo, muy útil para depurar
spring.jpa.show-sql=true
api.footballdata.key=99b5ac26bc4d43afae2860e3835f6849

